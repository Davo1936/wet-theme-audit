name: WET Visual Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Create and run audit
        shell: bash
        run: |
          cat > audit.js <<'EOF'
          const {chromium}=require('playwright'),fs=require('fs'),path=require('path');
          const base='https://wet.com.au',previewThemeId='183704027423',routes=[['home','/'],['events','/pages/events'],['pricing-entry','/pages/pricing-entry'],['first-timers','/pages/first-timers'],['gallery','/pages/gallery'],['food-drink','/pages/food-drink'],['from-the-team','/pages/from-the-team'],['faq','/pages/faq'],['sexual-health-clinic','/pages/sexual-health-clinic'],['contact','/pages/contact']],views=[['desktop',1440,1000],['mobile',390,844]],out='artifacts',results=[];fs.mkdirSync(out,{recursive:true});const wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function hide(p){await p.addStyleTag({content:`#preview-bar-iframe,#shopify-preview-bar,iframe[src*="preview_bar"],iframe[src*="preview-bar"],iframe[title*="preview" i],[data-shopify-preview-bar],.shopify-preview-bar{display:none!important;visibility:hidden!important;opacity:0!important}`}).catch(()=>{});await p.evaluate(()=>document.querySelectorAll('#preview-bar-iframe,#shopify-preview-bar,iframe[src*="preview_bar"],iframe[src*="preview-bar"],iframe[title*="preview" i],[data-shopify-preview-bar],.shopify-preview-bar').forEach(e=>e.remove())).catch(()=>{})}
          async function gate(p){return p.locator('age-verification-popup').filter({visible:true}).count().then(n=>n>0).catch(()=>false)}
          async function enter(p){for(let pass=0;pass<4;pass++){if(!await gate(p))return;const exit=p.locator('age-verification-popup [data-age-verification-popup-exit-button]').filter({visible:true}).first();if(!await exit.isVisible().catch(()=>false))throw new Error('Visible age-verification-popup has no visible exit button');await exit.click({timeout:5000});await p.waitForTimeout(1000)}throw new Error('Age gate remains visible after dismissal attempts')}
          async function verifyNoGate(p){if(await gate(p))throw new Error('Refusing normal screenshot while age-verification-popup is visible')}
          async function scroll(p){await p.evaluate(async()=>{const w=ms=>new Promise(r=>setTimeout(r,ms)),step=Math.max(250,innerHeight*.7);for(let pass=0;pass<3;pass++){const h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);for(let y=scrollY;y<h;y+=step){scrollTo(0,Math.min(y+step,h));await w(220)}await w(500);if(Math.max(document.body.scrollHeight,document.documentElement.scrollHeight)<=h)break}scrollTo(0,0);await w(700)})}
          async function inspect(p){return p.evaluate(()=>{const brokenImages=[...document.images].filter(i=>i.complete&&i.naturalWidth===0).map(i=>({src:i.currentSrc||i.src,alt:i.alt||''})),documentWidth=Math.max(document.documentElement.scrollWidth,document.body?.scrollWidth||0),documentHeight=Math.max(document.documentElement.scrollHeight,document.body?.scrollHeight||0),overflowPixels=Math.max(0,documentWidth-innerWidth),h=document.querySelector('header,[role=banner],.header,.site-header,.shopify-section-header'),s=h?getComputedStyle(h):null;return{brokenImages,horizontalOverflow:overflowPixels>0,overflowPixels,documentWidth,documentHeight,viewportWidth:innerWidth,viewportHeight:innerHeight,headerBackground:s?(s.backgroundColor||s.background):null,headerTextColour:s?s.color:null}})}
          async function states(p,v,r){if(v==='mobile'){let open=false;for(const l of [p.getByRole('button',{name:/menu|navigation/i}),p.locator('summary.header__icon--menu,button.menu-toggle,button.hamburger,[aria-controls*="menu" i]')]){for(let i=0,n=await l.count().catch(()=>0);i<n&&!open;i++){const x=l.nth(i);if(await x.isVisible().catch(()=>false)){await x.click().catch(()=>{});await p.waitForTimeout(700);open=true}}if(open)break}r.menuOpened=open;if(open){await hide(p);await verifyNoGate(p);let f='home-mobile-menu-open.png';await p.screenshot({path:path.join(out,f),fullPage:true});r.screenshots.push(f);await p.keyboard.press('Escape').catch(()=>{})}}await p.evaluate(()=>scrollTo(0,Math.min(900,document.documentElement.scrollHeight)));await p.waitForTimeout(1000);await hide(p);await verifyNoGate(p);let f=`home-${v}-sticky-header.png`;await p.screenshot({path:path.join(out,f)});r.screenshots.push(f);await p.evaluate(()=>scrollTo(0,0))}
          (async()=>{const b=await chromium.launch({headless:true});try{for(const[v,w,h]of views){const c=await b.newContext({viewport:{width:w,height:h},reducedMotion:'reduce'});for(const[name,route]of routes){const p=await c.newPage(),url=new URL(route,base);url.searchParams.set('preview_theme_id',previewThemeId);const r={page:name,route,url:url.href,viewport:{name:v,width:w,height:h},httpStatus:null,consoleErrors:[],pageJavaScriptErrors:[],failedNetworkRequests:[],screenshots:[],auditError:null,ageGateVisible:null};p.on('console',m=>{if(m.type()==='error')r.consoleErrors.push({text:m.text(),location:m.location()})});p.on('pageerror',e=>r.pageJavaScriptErrors.push(e.stack||String(e)));p.on('requestfailed',q=>r.failedNetworkRequests.push({method:q.method(),url:q.url(),error:q.failure()?.errorText||'failed'}));try{const response=await p.goto(r.url,{waitUntil:'domcontentloaded',timeout:120000});r.httpStatus=response?.status()??null;await p.waitForTimeout(2000);await hide(p);if(name==='home'){if(!await gate(p))throw new Error('Expected age-verification-popup was not visible on initial homepage load');let f=`home-${v}-premium-age-gate.png`;await p.screenshot({path:path.join(out,f),fullPage:true});r.screenshots.push(f)}await enter(p);await hide(p);await scroll(p);await hide(p);await verifyNoGate(p);let f=`${name}-${v}.png`;await p.screenshot({path:path.join(out,f),fullPage:true});r.screenshots.push(f);if(name==='home')await states(p,v,r);Object.assign(r,await inspect(p))}catch(e){r.auditError=e.stack||String(e)}finally{r.ageGateVisible=await gate(p);results.push(r);fs.writeFileSync(path.join(out,'audit-results.json'),JSON.stringify(results,null,2));await p.close().catch(()=>{});await wait(2500)}}await c.close()}}finally{fs.writeFileSync(path.join(out,'audit-results.json'),JSON.stringify(results,null,2));await b.close()}})().catch(e=>{console.error(e);process.exitCode=1});
          EOF
          node audit.js
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wet-premium-visual-audit
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
